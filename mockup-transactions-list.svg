  <text x="90" y="512" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="13">Client transfer • Bank</text>
  <text x="268" y="494" fill="#047857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">+₹8,000</text>
  
  <!-- Item 6 -->
  <rect x="20" y="550" width="320" height="72" fill="#151E2E" rx="16"/>
  <circle cx="55" cy="586" r="20" fill="#DC2626"/>
  <text x="90" y="576" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="16" font-weight="500">Zomato</text>
  <text x="90" y="594" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="13">Food delivery • UPI</text>
  <text x="292" y="576" fill="#DC2626" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">−₹245</text>
  
  <!-- Item 7 -->
  <rect x="20" y="632" width="320" height="72" fill="#151E2E" rx="16"/>
  <circle cx="55" cy="668" r="20" fill="#2563EB"/>
  <text x="90" y="658" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="16" font-weight="500">Electricity bill</text>
  <text x="90" y="676" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="13">Tata Power • AutoPay</text>
  <text x="278" y="658" fill="#DC2626" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">−₹1,850</text>
  
  <!-- Item 8 -->
  <rect x="20" y="714" width="320" height="72" fill="#151E2E" rx="16"/>
  <circle cx="55" cy="750" r="20" fill="#DC2626"/>
  <text x="90" y="740" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="16" font-weight="500">Netflix subscription</text>
  <text x="90" y="758" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="13">Monthly • Card</text>
  <text x="286" y="740" fill="#DC2626" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">−₹199</text>
</svg>
