<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800">
  <!-- Sumvalo Add Transaction — Swiss Minimalist -->
  <!-- Design system from ui-ux-pro-max: Minimalism & Swiss Style -->

  <rect width="360" height="800" fill="#0B1220"/>

  <rect x="0" y="0" width="360" height="44" fill="#0B1220"/>
  <text x="20" y="80" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em">Add expense</text>

  <!-- Amount field -->
  <rect x="20" y="110" width="320" height="128" fill="#151E2E" rx="24" stroke="#2A3850" stroke-width="1"/>
  <text x="40" y="138" fill="#9FADC4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">Amount</text>
  <text x="40" y="170" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.03em">₹0.00</text>

  <!-- Type chips -->
  <text x="20" y="256" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Type</text>

  <rect x="20" y="270" width="100" height="56" fill="#DC2626" rx="16"/>
  <text x="60" y="294" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500">Expense</text>

  <rect x="140" y="270" width="100" height="56" fill="#151E2E" rx="16" stroke="#2A3850" stroke-width="1"/>
  <text x="180" y="294" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500">Income</text>

  <rect x="260" y="270" width="80" height="56" fill="#151E2E" rx="16" stroke="#2A3850" stroke-width="1"/>
  <text x="290" y="294" fill="#9FADC4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Transfer</text>

  <!-- Date -->
  <text x="20" y="346" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Date</text>
  <rect x="20" y="360" width="320" height="56" fill="#151E2E" rx="14"/>
  <circle cx="55" cy="388" r="14" fill="#2563EB"/>
  <text x="90" y="392" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500">Oct 28, 2026</text>
  <path d="M300 388L305 383L305 393Z" fill="none" stroke="#9FADC4" stroke-width="2"/>

  <!-- Category -->
  <text x="20" y="434" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Category</text>
  <rect x="20" y="448" width="320" height="56" fill="#151E2E" rx="14"/>
  <circle cx="55" cy="476" r="14" fill="#2563EB"/>
  <text x="90" y="480" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500">Food &amp; dining</text>
  <path d="M300 476L305 471L305 481Z" fill="none" stroke="#9FADC4" stroke-width="2"/>

  <!-- Merchant -->
  <text x="20" y="522" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Merchant</text>
  <rect x="20" y="536" width="320" height="56" fill="#151E2E" rx="14"/>
  <text x="40" y="562" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="15">Swiggy</text>

  <!-- Notes -->
  <text x="20" y="610" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Notes</text>
  <rect x="20" y="624" width="320" height="96" fill="#151E2E" rx="14"/>
  <text x="40" y="650" fill="#9FADC4" font-family="Inter, system-ui, sans-serif" font-size="14">Add a note…</text>

  <!-- Save button -->
  <rect x="20" y="736" width="320" height="56" fill="#DC2626" rx="16"/>
  <text x="180" y="768" fill="#F3F6FB" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Save transaction</text>
</svg>
