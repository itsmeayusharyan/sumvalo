<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800">
  <!-- Sumvalo Home — Minimal &amp; Polished -->
  <!-- Palette: BG #0B1220, Surface #151E2E, Border #2A3850, Ink #F3F6FB, Muted #9FADC4, Blue #2563EB, Emerald #047857, Red #DC2626 -->
  
  <rect width="360" height="800" fill="#0B1220"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="360" height="92" fill="#0B1220"/>
  <text x="20" y="58" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Home</text>
  <text x="20" y="76" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="14">₹1,24,500 net worth</text>
  
  <!-- Net worth card -->
  <rect x="20" y="100" width="320" height="96" fill="#151E2E" rx="20" stroke="#2A3850" stroke-width="1"/>
  <text x="40" y="128" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">NET WORTH</text>
  <text x="40" y="154" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="32" font-weight="700">₹1,24,500</text>
  <text x="40" y="176" fill="#66A3FF" font-family="system-ui, sans-serif" font-size="13">+₹3,200 this month</text>
  
  <!-- Balance cards row -->
  <rect x="20" y="202" width="150" height="88" fill="#151E2E" rx="16" stroke="#2A3850" stroke-width="1"/>
  <text x="40" y="238" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">Cash</text>
  <text x="40" y="254" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="18" font-weight="600">₹8,420</text>
  
  <rect x="190" y="202" width="150" height="88" fill="#151E2E" rx="16" stroke="#2A3850" stroke-width="1"/>
  <text x="210" y="238" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">Credit</text>
  <text x="210" y="254" fill="#DC2626" font-family="system-ui, sans-serif" font-size="18" font-weight="600">−₹12,000</text>
  
  <!-- Quick actions -->
  <text x="20" y="318" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Quick actions</text>
  
  <!-- Action 1 -->
  <rect x="20" y="332" width="108" height="88" fill="#151E2E" rx="18"/>
  <circle cx="74" cy="372" r="20" fill="#2563EB"/>
  <path d="M68 366L80 366M74 360L74 378" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="74" y="406" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Add expense</text>
  
  <!-- Action 2 -->
  <rect x="142" y="332" width="108" height="88" fill="#151E2E" rx="18"/>
  <circle cx="196" cy="372" r="20" fill="#047857"/>
  <path d="M190 366L202 366M194 360L194 378" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="196" y="406" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Add income</text>
  
  <!-- Action 3 -->
  <rect x="262" y="332" width="78" height="88" fill="#151E2E" rx="18"/>
  <circle cx="301" cy="372" r="20" fill="#9FADC4"/>
  <path d="M295 366L307 366M300 360L300 378" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="301" y="406" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Transfer</text>
  
  <!-- Recent transactions -->
  <text x="20" y="448" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Recent</text>
  
  <!-- Item 1 -->
  <rect x="20" y="470" width="320" height="56" fill="#151E2E" rx="16"/>
  <circle cx="55" cy="506" r="16" fill="#DC2626"/>
  <text x="90" y="492" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Swiggy</text>
  <text x="90" y="508" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="12">Food delivery</text>
  <text x="300" y="492" fill="#DC2626" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">−₹450</text>
  
  <!-- Item 2 -->
  <rect x="20" y="534" width="320" height="56" fill="#151E2E" rx="16"/>
  <circle cx="55" cy="570" r="16" fill="#047857"/>
  <text x="90" y="556" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Salary credit</text>
  <text x="90" y="574" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="12">HDFC Bank</text>
  <text x="288" y="556" fill="#047857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">+₹45,000</text>
  
  <!-- Item 3 -->
  <rect x="20" y="598" width="320" height="56" fill="#151E2E" rx="16"/>
  <circle cx="55" cy="632" r="16" fill="#DC2626"/>
  <text x="90" y="642" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Amazon</text>
  <text x="90" y="660" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="12">Online shopping • Card</text>
  <text x="292" y="642" fill="#DC2626" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">−₹1,299</text>
  
  <!-- Bottom navigation -->
  <rect x="20" y="688" width="320" height="56" fill="#151E2E" rx="28"/>
  <circle cx="55" cy="716" r="14" fill="#2563EB"/>
  <text x="55" y="728" fill="#F3F6FB" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Home</text>
  
  <circle cx="130" cy="732" r="14" fill="#151E2E"/>
  <text x="130" cy="744" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Activity</text>
  
  <circle cx="205" cy="732" r="14" fill="#151E2E"/>
  <text x="205" cy="744" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Insights</text>
  
  <circle cx="280" cy="732" r="14" fill="#151E2E"/>
  <text x="280" cy="744" fill="#9FADC4" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Settings</text>
</svg>
