name: Release

# Builds the release APK signed with the Sumvalo release key and publishes it as a GitHub release.
#
# Releases are normally published by `scripts/release-sync.sh` (!sync): it pushes the source,
# creates the vX.Y.Z tag and attaches the locally built, audited APK with the version's changelog
# as notes. This workflow therefore no longer fires on tag or branch pushes — it exists for the
# Actions tab (Release > Run workflow) and needs the three repository secrets configured there:
# SUMVALO_KEYSTORE_BASE64 (`base64 -w0 keystore/sumvalo-release.jks`),
# SUMVALO_STORE_PASSWORD and SUMVALO_KEY_PASSWORD.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && GH_TOKEN="${{ github.token }}" gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Restore the release keystore
        if: env.SKIP != '1'
        env:
          SUMVALO_KEYSTORE_BASE64: ${{ secrets.SUMVALO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SUMVALO_KEYSTORE_BASE64" ]; then
            echo "The SUMVALO_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          mkdir -p keystore
          echo "$SUMVALO_KEYSTORE_BASE64" | base64 -d > keystore/sumvalo-release.jks
      - name: Build both editions (release-signed)
        if: env.SKIP != '1'
        env:
          SUMVALO_STORE_PASSWORD: ${{ secrets.SUMVALO_STORE_PASSWORD }}
          SUMVALO_KEY_PASSWORD: ${{ secrets.SUMVALO_KEY_PASSWORD }}
        run: |
          # No build cache: a cached compile can differ from a clean one, and F-Droid rebuilds from scratch and
          # only publishes the release APK when its own build is identical.
          ./gradlew :app:assembleRelease --console=plain --no-build-cache \
            -PSUMVALO_STORE_PASSWORD="$SUMVALO_STORE_PASSWORD" -PSUMVALO_KEY_PASSWORD="$SUMVALO_KEY_PASSWORD"
      - name: Check signature and that the APK has no INTERNET permission
        if: env.SKIP != '1'
        env:
          # The key installed copies of Sumvalo are signed with; an APK signed with anything else can't update them.
          EXPECTED_SIGNER: 02283b8d09a5a1912906e9b5d3abed25ed4445de005f57a79cea0443f0317934
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release.apk Sumvalo.apk
          cp app/build/outputs/apk/release/app-release.apk Sumvalo-universal.apk
          for apk in Sumvalo.apk; do
            signer=$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
            if [ "$signer" != "$EXPECTED_SIGNER" ]; then
              echo "$apk is signed with $signer, not the Sumvalo release key. Check the SUMVALO_* secrets."; exit 1
            fi
          done
          sha256sum Sumvalo.apk > SHA256SUMS
          if "$BUILD_TOOLS/aapt2" dump permissions Sumvalo-universal.apk | grep -q "android.permission.INTERNET"; then
            echo "Sumvalo must not request INTERNET"; exit 1
          fi
      - name: Publish the GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Sumvalo $VERSION"
            cat "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" 2>/dev/null
            echo
            echo "Signed with the Sumvalo release key: installs over earlier versions and keeps your data."
            echo "Sumvalo.apk is the universal release APK; it has no internet permission. Checksums: SHA256SUMS."
          } > notes.txt
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Replaces any files published earlier under this tag and makes it the latest full release.
            gh release upload "$TAG" Sumvalo.apk SHA256SUMS --clobber
            gh release edit "$TAG" --title "Sumvalo $VERSION" --notes-file notes.txt --prerelease=false --latest
          else
            gh release create "$TAG" Sumvalo.apk SHA256SUMS --target "$GITHUB_SHA" --title "Sumvalo $VERSION" --notes-file notes.txt
          fi
      - name: Remove the keystore
        if: always()
        run: rm -f keystore/sumvalo-release.jks
