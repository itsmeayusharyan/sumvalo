name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Check the APK has no INTERNET permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q "android.permission.INTERNET"; then
            echo "Sumvalo must not request INTERNET"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sumvalo-debug-apk
          path: app/build/outputs/apk/**/*.apk
